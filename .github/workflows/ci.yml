# Validate the Dashy config against the schema shipped in the exact image we
# deploy (so a schema change arrives with the version bump, not before), lint
# it for dead/private links, and make sure the image still builds.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract schema from the pinned Dashy image
        run: |
          image=$(awk '/^FROM /{print $2; exit}' Dockerfile)
          docker run --rm --entrypoint cat "$image" /app/src/utils/config/ConfigSchema.json > "$RUNNER_TEMP/schema.json"
      - name: Install lint deps
        run: pip install pyyaml jsonschema
      - name: Lint conf.yml and its pages
        run: python3 scripts/lint.py "$RUNNER_TEMP/schema.json" conf.yml

  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t dashy-wardcrew .
