services:
  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    ports:
      - "4000:8080"
    volumes:
      # Absolute host path, not relative: this compose file gets invoked by
      # DeployButton's backend container (via the shared docker.sock), whose
      # cwd is /srv/repos/dashy -- but the real docker daemon runs on the
      # host and needs the actual host path for the bind-mount syscall, not
      # the calling container's view of it.
      - /home/r/Documents/GitHub/dashy/dashy-config.yml:/app/user-data/conf.yml
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "/app/services/healthcheck"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
